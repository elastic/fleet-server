version: 9.5.7
entries:
    - kind: bug-fix
      summary: Substitute secrets for pending actions during check-in
      description: |
        Fleet Server now replaces `$co.elastic.secret{id}` references in action data
        for actions returned by the check-in pending-actions path. Previously, only
        actions delivered through the dispatcher were substituted, so agents that
        received an action while offline or between check-ins got the literal secret
        reference instead of the secret value.
      component: fleet-server
      pr:
        - https://github.com/elastic/fleet-server/pull/8152
      issue:
        - https://github.com/elastic/fleet-server/issues/8103
      impact: ""
      action: ""
      timestamp: 1793193137
      file:
        name: 1793193137-substitute-pending-action-secrets.yaml
        checksum: 3551ca17d51eda1e405f61f66a64118d39dc2aeb
