      file:
        name: 1786053515-revision-guard-policy-monitor.yaml
        checksum: 7d6f4ee30d0ec5e252c2bf38c8ecda740a165d79
    - kind: bug-fix
      summary: Read cgroup memory limit for cache sizing when GOMEMLIMIT is not set
      description: |
        containerMemoryMB() now falls back to the cgroup memory limit (v2 then v1) before host RAM. This ensures fleet-server is correctly sized for the container even in deployments that do not explicitly set GOMEMLIMIT.
      component: fleet-server
      pr:
        - https://github.com/elastic/fleet-server/pull/7593
        - https://github.com/elastic/fleet-server/pull/7656
        - https://github.com/elastic/fleet-server/pull/7659
