version: 9.5.2
entries:
    - kind: unknown
      summary: Limit concurrent secret reads to reduce memory pressure under high agent check-in load
      description: |
        Under high concurrent agent check-in load, fleet-server could open an
        unbounded number of concurrent connections to Elasticsearch to resolve
        policy secret references, contributing to out-of-memory conditions on
        large deployments.

        Secret reads are now capped at 32 concurrent in-flight requests.
        Excess reads wait until a slot is available.
      component: fleet-server
      pr:
        - https://github.com/elastic/fleet-server/pull/7593
        - https://github.com/elastic/fleet-server/pull/7656
        - https://github.com/elastic/fleet-server/pull/7659
      issue: []
      impact: ""
      action: ""
      timestamp: 1786037058
      file:
        name: 1786037058-rate-limit-read-secrets.yaml
        checksum: 0bd4fb4d3e57b4338bf99b6bd9f6606a1d7887f2
    - kind: bug-fix
      summary: Reject stale policy revisions before secret resolution in the policy monitor
      description: |
        After a Kibana index migration, the `.fleet-policies` change-feed can deliver
        older revision documents (with higher _seq_no values) after the policy monitor
        has already cached a newer revision. Fleet Server now checks the incoming
        revision_idx against the cached revision before attempting to parse the policy
        or resolve its secrets. Stale revisions are dropped with a warning log and do
        not overwrite the cached policy.
      component: fleet-server
      pr:
        - https://github.com/elastic/fleet-server/pull/7572
      issue:
        - https://github.com/elastic/fleet-server/issues/7570
      impact: ""
      action: ""
