kind: feature

summary: Keep agent access key after UNENROLL so a follow-up UNINSTALL can be delivered.

description: |
  The UNENROLL action that reaches an agent is now the first step of the remote
  uninstall flow. When it is acknowledged, Fleet Server finalizes the unenroll
  the same way it does for any agent (setting `unenrolled_at`) but, for
  uninstall-capable agents, keeps the agent active with its access API key valid
  and records a new additive `uninstall_pending` state on the agent document
  instead of deactivating and invalidating it. The agent's output API keys (for
  example Elasticsearch) are invalidated at this point so the unenrolled agent
  immediately stops shipping data. While in this state the agent keeps checking
  in so it can receive the follow-up UNINSTALL action (and its grace-period
  CANCEL). Fleet Server does not filter which actions it delivers based on this
  state: the agent is the authoritative source of its own state and rejects any
  action it must not act on while awaiting uninstall. The agent's access key is
  finally invalidated and the agent marked inactive when the UNINSTALL is
  acknowledged, at which point Fleet Server also records a new `uninstalled_at`
  timestamp (server time) so an uninstalled agent is distinguishable from a plain
  unenrolled one. This behavior is gated on the agent advertising UNINSTALL support
  via the `uninstallable` flag in its local_metadata: agents that do not
  advertise it (older agents) keep the previous behavior and have their
  credentials invalidated immediately on UNENROLL, preserving backward
  compatibility. Server-side force-unenroll (which deletes the agent without
  contacting it) is unchanged, and MIGRATE remains terminal.

component: fleet-server

# issue: https://github.com/elastic/elastic-agent/issues/3367
