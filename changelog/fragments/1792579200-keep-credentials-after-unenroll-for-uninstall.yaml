kind: feature

summary: Keep agent credentials after UNENROLL so a follow-up UNINSTALL can be delivered.

description: |
  The UNENROLL action that reaches an agent is now the first step of the remote
  uninstall flow. When it is acknowledged, Fleet Server keeps the agent's API
  keys valid and leaves it active, recording a new `uninstall_pending` state on
  the agent document instead of invalidating it. While in this state the agent
  keeps checking in, but only UNINSTALL and CANCEL actions are delivered to it
  (policy changes and all other actions are withheld). An UNINSTALL action is
  only delivered once the agent has been unenrolled (is pending uninstall); for
  any other agent it is rejected and a failed action result is written to
  .fleet-actions-results so the failure is explicit. The agent's credentials are finally
  invalidated and the agent marked inactive when the UNINSTALL is acknowledged.
  This behavior is gated on the agent advertising UNINSTALL support via the
  `uninstallable` flag in its local_metadata: agents that do not advertise it
  (older agents) keep the previous behavior and have their credentials
  invalidated immediately on UNENROLL, preserving backward compatibility.
  Server-side force-unenroll (which deletes the agent without contacting it) is
  unchanged, and MIGRATE remains terminal.

component: fleet-server

# issue: https://github.com/elastic/elastic-agent/issues/3367
