kind: enhancement
component: fleet-server

summary: Record an agent's UPGRADE result from its check-in upgrade_details instead of its UPGRADE ack

description: |
  Fleet Server now records an agent's upgrade result from the `upgrade_details` the agent reports on check-in rather than from its UPGRADE ack, so a failed or rolled-back upgrade is recorded as a failure.
  The ack no longer writes when it matches the agent's reported `upgrade_details`, so a retried ack no longer repeats Elasticsearch writes.

issue: https://github.com/elastic/fleet-server/issues/8274
