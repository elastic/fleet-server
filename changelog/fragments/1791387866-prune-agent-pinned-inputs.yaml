kind: enhancement

summary: Omit inputs pinned to other agents from the per-agent policy

description: |
  Inputs and streams whose condition references `${agent.id}` and can never be
  true for the requesting agent (for example `${agent.id} == '<other id>'`) are
  no longer sent to it, reducing policy size for policies that shard inputs
  across many agents (e.g. scalable Synthetics private locations). Conditions
  are evaluated with Elastic Agent's EQL semantics, and anything that cannot be
  decided is sent unchanged for the agent to evaluate. Set
  `feature_flags.evaluate_conditions.agent_id: false` to send every input
  unchanged.

component: fleet-server

issue: https://github.com/elastic/fleet-server/issues/7999
