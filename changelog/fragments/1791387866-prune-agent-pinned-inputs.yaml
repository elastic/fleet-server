kind: enhancement

summary: Omit Synthetics inputs pinned to other agents from the per-agent policy

description: |
  Synthetics inputs and streams whose condition is `${agent.id} == '<id>'` for a
  different agent are no longer sent to the requesting agent, reducing policy
  size for scalable Synthetics private locations that shard monitors across
  many agents. Elastic Agent already discarded these inputs at runtime. Inputs
  of any other type are delivered unchanged. Set
  `feature_flags.evaluate_conditions.agent_id: false` to send every input
  unchanged.

component: fleet-server

issue: https://github.com/elastic/fleet-server/issues/7999
