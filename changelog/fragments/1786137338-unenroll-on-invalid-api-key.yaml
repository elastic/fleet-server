kind: enhancement

summary: Add empty_policy_on_invalid_api_key feature flag to silence agents with invalid API keys

description: |
  Fleet Server now supports a new feature flag `empty_policy_on_invalid_api_key`
  under `inputs[].server.feature_flags`. When enabled, a checkin request that
  arrives with an invalid, expired, or disabled API key returns HTTP 200 with
  a POLICY_CHANGE action carrying an empty policy instead of the default HTTP 401
  response.

  The empty policy causes the agent to stop all inputs.

  The flag is disabled by default; existing behaviour is unchanged unless it
  is explicitly set to `true` in the configuration.

component: fleet-server
