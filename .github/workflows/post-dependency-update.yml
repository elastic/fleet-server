# Follow-on actions for dependency update PRs (Dependabot and Renovate). In
# elastic/fleet-server, changes to dependencies in go.mod require NOTICE.txt and
# NOTICE-fips.txt to be updated. This workflow applies those follow-on changes to
# the dependency update branch.
name: post-dependency-update

on:
  push:
    branches:
      - 'dependabot/go_modules/**'
      - 'renovate/*golang/**'

jobs:
  update-notice:
    permissions:
      # Allow job to write to the branch.
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version

      - uses: magefile/mage-action@v4
        with:
          install-only: true

      - name: update NOTICE.txt and NOTICE-FIPS.txt
        run: mage check:notice

      - name: run go mod tidy in testing/
        run: cd testing; go mod tidy

      - name: check for modified files
        id: check-files
        run: echo "modified=$(if git diff-index --quiet HEAD -- NOTICE.txt NOTICE-fips.txt testing/go.mod testing/go.sum; then echo "false"; else echo "true"; fi)" >> $GITHUB_OUTPUT

      - name: commit modified files
        if: steps.check-files.outputs.modified == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add NOTICE.txt NOTICE-fips.txt testing/go.mod testing/go.sum
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git commit -m "Post dependency update file modifications"
          git push
