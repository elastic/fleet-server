name: golangci-lint
on:
  #push:
  #  branches:
  #    - main
  #    - 8.*
  #    - 7.17
  pull_request:
permissions:
  contents: read
  # Optional: allow read access to pull request. Use with `only-new-issues` option.
  pull-requests: read
  checks: write
jobs:
  golangci:
    strategy:
      matrix:
        # golangci-lint only checks files whose build constraints are satisfied
        # by the active tags, so every custom //go:build tag needs its own run
        # to actually get linted. Keep in sync with buildTagSets in magefile.go.
        include:
          - GOOS: linux
            tagset:
              name: default
              tags: ''
          - GOOS: linux
            tagset:
              name: snapshot-fips-mage
              tags: 'snapshot,requirefips,mage'
          - GOOS: linux
            tagset:
              name: integration
              tags: 'integration'
          #- GOOS: windows
          #- GOOS: darwin
    name: lint (${{ matrix.GOOS }}, ${{ matrix.tagset.name }})
    runs-on: ubuntu-latest
    steps:
      - name: Echo details
        env:
          GOOS: ${{ matrix.GOOS }}
        run: echo Go GOOS=$GOOS

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version

      - name: golangci-lint
        env:
          GOOS: ${{ matrix.GOOS }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          # Optional: version of golangci-lint to use in form of v1.2 or v1.2.3 or `latest` to use the latest version
          version: v2.15.0

          # Give the job more time to execute.
          # Regarding `--whole-files`, the linter is supposed to support linting of changed a patch only but,
          # for some reason, it's very unreliable this way - sometimes it does not report any or some
          # issues without linting the whole files, so we have to use `--whole-files`
          # which can lead to some frustration from developers who would like to
          # fix a single line in an existing codebase and the linter would force them
          # into fixing all linting issues in the whole file instead.
          args: --timeout=30m --whole-files --build-tags=${{ matrix.tagset.tags }}
          # Optional: show only new issues if it's a pull request. The default value is `false`.
          only-new-issues: true
